name: mediledger

# Base stack: Postgres, IPFS, the API and the web app. It runs on its own with
# the ledger disabled, so the project comes up on a fresh machine without
# standing up a Fabric network first.
#
#   docker compose up -d --build
#
# To run with the ledger, bring up blockchain/network/network.sh first and add
# the Fabric overlay, which joins the backend to the Fabric network:
#
#   docker compose -f docker-compose.yml -f docker-compose.fabric.yml up -d --build

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediledger}
      POSTGRES_DB: mediledger
    ports:
      # 5432 belongs to the local PostgreSQL install; use 5434 for Prisma Studio / pgAdmin
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  ipfs:
    image: ipfs/kubo:v0.43.1
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Backend
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-mediledger}@postgres:5432/mediledger
      IPFS_NODE_URL: http://ipfs:5001
      PORT: 5000
      # Origins allowed to call the API. Set to the deployed web address.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://localhost:5173}
      # Off by default; the Fabric overlay turns it on
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./Backend/src
          target: /app/src
        - action: sync+restart
          path: ./Backend/middleware
          target: /app/middleware
        - action: sync+restart
          path: ./Backend/config
          target: /app/config
        - action: rebuild
          path: ./Backend/package.json
        - action: rebuild
          path: ./Backend/prisma

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time, so changing it needs a rebuild
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      # 8080 is a common default and often taken; 8081 keeps the stack
      # starting on a machine that already has something there.
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  ipfs-data:
